[package]
name = "image-resizer"
version = "0.3.0"
authors = ["Magic Len <len@magiclen.org>"]
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/magiclen/image-resizer"
homepage = "https://magiclen.org/image-resizer"
keywords = ["image", "resize", "shrink", "sharpen"]
categories = ["command-line-utilities"]
description = "Resize or just shrink images and sharpen them appropriately."
license = "MIT"
include = ["src/**/*", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
clap = { version = "4", features = ["derive"] }
concat-with = "0.2"
terminal_size = "0.4"

anyhow = "1"

image-convert = "0.22"
threadpool = "1"

walkdir = "2"
